<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗泉 Demo — 随机与搜索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="诗泉 Demo">
        <span class="seal" aria-hidden="true">诗</span>
        <span class="brand-text">
          <strong>诗泉</strong>
          <em>随机 · 搜索</em>
        </span>
      </a>
      <label class="lang-switch">
        <span class="sr-only">语言</span>
        <select id="lang" aria-label="简繁切换">
          <option value="zh-Hans">简体</option>
          <option value="zh-Hant">繁體</option>
        </select>
      </label>
    </header>

    <main>
      <section class="reader" aria-labelledby="poem-title">
        <div class="reader-inner" id="reader">
          <p class="status" id="reader-status">正在取诗…</p>
          <h1 class="poem-title" id="poem-title" hidden></h1>
          <p class="poem-meta" id="poem-meta" hidden></p>
          <div class="poem-body" id="poem-body" hidden></div>
        </div>
        <div class="reader-actions">
          <button type="button" class="btn-ink" id="btn-random">换一首</button>
        </div>
      </section>

      <section class="search" aria-labelledby="search-heading">
        <h2 id="search-heading">寻诗</h2>
        <form class="search-form" id="search-form">
          <label class="sr-only" for="search-q">关键词</label>
          <input
            id="search-q"
            name="q"
            type="search"
            placeholder="输入诗句、标题或作者…"
            autocomplete="off"
            required
          />
          <button type="submit" class="btn-ink">搜索</button>
        </form>
        <p class="search-hint" id="search-status" role="status"></p>
        <ul class="search-results" id="search-results"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        数据来自
        <a href="https://poetry.palemoky.com/" target="_blank" rel="noopener">诗泉 API</a>
        ，源自开源项目 chinese-poetry。
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
